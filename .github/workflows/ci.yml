name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same PR; queue and merge-group runs are never replaced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python tests
    timeout-minutes: 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The same contract the Forgejo ci-profile ran (.ci/profile.json), moved
      # here when GitHub became this repo's only CI (GIT-CI-STRATEGY-20261123).
      - name: Install isolated test tools
        run: python3 -m venv .venv && .venv/bin/pip install --quiet pytest==9.1.1 ruff==0.15.7

      - name: Lint CI contract
        run: >-
          .venv/bin/ruff check actions/ci-profile scripts/ci_adoption_audit.py
          scripts/ci_experiment.py scripts/ci_experiment_evidence.py tests/test_ci_profile.py
          tests/test_ci_adoption_audit.py tests/test_ci_experiment.py
          scripts/self_description_check.py tests/test_self_description_check.py
          scripts/structure_signals.py tests/test_structure_signals.py

      - name: Compile shipped Python tools
        run: python3 -m compileall -q scripts actions/ci-profile

      - name: Run tests and negative fixtures
        run: .venv/bin/python -m pytest tests -q --tb=short

      - name: Exercise shipped commands
        run: |
          python3 scripts/check-agent-parity.py --help
          python3 scripts/ci_adoption_audit.py --help
          python3 scripts/ci_experiment.py --help
          python3 scripts/self_description_check.py --help
          python3 scripts/structure_signals.py . > /dev/null
