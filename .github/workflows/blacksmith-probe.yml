name: Reusable Blacksmith Probe

on:
  workflow_call:
    inputs:
      probe_label:
        description: Label printed in the run summary.
        required: false
        type: string
        default: org-probe

permissions:
  contents: read

jobs:
  probe:
    name: Blacksmith Probe
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      # No checkout: the probe proves the runner, and the repository shape below
      # comes from one API call, so a large repository costs no clone time.
      - name: Runner identity
        env:
          PROBE_LABEL: ${{ inputs.probe_label }}
        run: |
          set -euo pipefail
          echo "probe_label=${PROBE_LABEL}"
          echo "repo=${GITHUB_REPOSITORY}"
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          uname -a
          git --version
          python3 --version
          node --version 2>/dev/null || true
          go version 2>/dev/null || true

      - name: Repository shape
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'ref=%s\n' "${GITHUB_REF_NAME:-unknown}"
          # Files at most two levels deep, as `find . -maxdepth 2 -type f` listed them.
          gh api "repos/${GITHUB_REPOSITORY}/git/trees/${GITHUB_SHA}?recursive=1" \
            --jq '.tree[] | select(.type == "blob") | .path' \
            | awk -F/ 'NF <= 2 { print "./" $0 }' \
            | sort \
            | sed -n '1,80p'
