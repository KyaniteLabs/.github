version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    # One weekly PR for all action bumps instead of one PR (and one CI run) each.
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
