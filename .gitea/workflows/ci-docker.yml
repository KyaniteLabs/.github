name: Docker Build
on:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Build Docker image
        run: docker build -t test .
