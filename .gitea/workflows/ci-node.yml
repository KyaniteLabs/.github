name: Node CI
# Declare the project's .ci/profile.json first; see docs/CI_PROFILES.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: KyaniteLabs/.github/.forgejo/workflows/ci-profile.yml@fc3497dc98bf1bf8f283c70bcbf4d88a49aa1505
