name: Measured CI profile
description: Execute explicit required phases without hiding failures and retain source-bound timings.
inputs:
  profile:
    description: Project-owned version 1 JSON profile, relative to the checkout
    default: .ci/profile.json
runs:
  using: composite
  steps:
    - name: Ensure profile runtime
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null; then
          apt-get update -qq
          apt-get install -y -qq python3
        fi
    - name: Execute project contract
      shell: bash
      env:
        CI_PROFILE_PATH: ${{ inputs.profile }}
      run: python3 "$GITHUB_ACTION_PATH/run.py" "$CI_PROFILE_PATH"
    # Layer 5: the repo must describe itself consistently (manifest version vs
    # CHANGELOG vs README). The script ships in this same checkout, two levels
    # above the action directory. Exit 0 = OK, 1 = mismatch (fail), 2 = not
    # applicable (pass) — repos with no version-bearing surfaces skip cleanly.
    - name: Layer 5 self-description consistency
      shell: bash
      run: |
        set -uo pipefail
        script="$GITHUB_ACTION_PATH/../../scripts/self_description_check.py"
        # Fail closed if the script is ever moved: rc 2 means "not applicable"
        # and would otherwise mask a missing script as a clean pass.
        [ -f "$script" ] || { echo "self-description check script missing" >&2; exit 1; }
        rc=0
        python3 "$script" . || rc=$?
        if [ "$rc" -eq 2 ]; then
          echo "gate evidence: self-description check not applicable here"
        elif [ "$rc" -ne 0 ]; then
          exit "$rc"
        fi
    # Layer 3: executable docs. README blocks tagged ```bash readme-test run
    # after the project contract, so they see the built checkout. Same exit
    # contract as Layer 5: 2 = not applicable (no tagged blocks) passes.
    - name: Layer 3 executable README blocks
      shell: bash
      run: |
        set -uo pipefail
        script="$GITHUB_ACTION_PATH/../../scripts/readme_exec.py"
        [ -f "$script" ] || { echo "readme-exec script missing" >&2; exit 1; }
        rc=0
        python3 "$script" . || rc=$?
        if [ "$rc" -eq 2 ]; then
          echo "gate evidence: executable README check not applicable here"
        elif [ "$rc" -ne 0 ]; then
          exit "$rc"
        fi
    # Layer 3: before/after evidence. Summarize this run into
    # .ci-results/evidence.json (uploaded with the other results), then compare
    # it against the latest main-branch evidence on the ci-evidence branch.
    # Advisory: deltas and regressions are printed, never fail the job.
    - name: Layer 3 before/after evidence
      shell: bash
      env:
        CI_PROFILE_PATH: ${{ inputs.profile }}
        EVIDENCE_TOKEN: ${{ github.token }}
        EVIDENCE_API: ${{ github.api_url }}
        EVIDENCE_REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        script="$GITHUB_ACTION_PATH/../../scripts/ci_evidence.py"
        [ -f "$script" ] || { echo "evidence script missing" >&2; exit 1; }
        python3 "$script" collect . --profile "$CI_PROFILE_PATH" || exit $?
        base="$(mktemp)"
        code=$(curl -s -o "$base" -w '%{http_code}' -H "Authorization: token $EVIDENCE_TOKEN" \
          "$EVIDENCE_API/repos/$EVIDENCE_REPO/raw/evidence/main.json?ref=ci-evidence" || echo 000)
        [ "$code" = 200 ] || rm -f "$base"
        python3 "$script" compare "$base" .ci-results/evidence.json
